[workspace]
resolver = "2"
members = [
    "programs/supersonic-tx",
    "crates/supersonic-tx-core",
]
exclude = [
    "programs/supersonic-tx-tests",
]

[workspace.package]
version = "0.1.0"
authors = ["Superteam Brazil Privacy Guild <privacy@solana.br>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/solanabr/supersonic-tx"
readme = "README.md"
description = "Solana transaction tooling that adds limited behavioral obscurity without claiming anonymity or fund concealment."

[workspace.dependencies]
solana-sdk = "~1.18"
solana-program = "~1.18"
solana-client = "~1.18"
anchor-lang = "0.30.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
clap = { version = "=4.4.18", features = ["derive", "env"] }
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = "0.3"
supersonic-tx-core = { path = "crates/supersonic-tx-core" }
supersonic-tx-sdk = { path = "crates/supersonic-tx-sdk" }
account-cooker = { path = "crates/account-cooker" }

[profile.release]
overflow-checks = true
