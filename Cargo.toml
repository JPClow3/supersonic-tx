[workspace]
resolver = "2"
members = [
    "programs/supersonic-tx",
    "crates/account-cooker",
    "crates/supersonic-tx-core",
    "crates/supersonic-tx-sdk",
    "crates/supersonic-tx-cli",
]

[workspace.package]
version = "0.1.0"
authors = ["Superteam Brazil Privacy Guild <privacy@solana.br>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/solanabr/supersonic-tx"
readme = "README.md"
description = "Fuzzy transaction bundles on Solana to defeat on-chain analytics, MEV front-runners, and copy-traders through behavioral obscurity."

[workspace.dependencies]
solana-sdk = "~1.18"
solana-program = "~1.18"
solana-client = "~1.18"
anchor-lang = "0.30.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = "0.3"
supersonic-tx-core = { path = "crates/supersonic-tx-core" }
supersonic-tx-sdk = { path = "crates/supersonic-tx-sdk" }
