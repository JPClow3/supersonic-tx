name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  # Full-workspace `anchor build` is not the supported path under Anchor 0.30.1
  # (edition2024 / lock drift). SBF + IDL use the dual-lock script + backpack image.
  sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SBF .so + IDL (dual-lock)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$RUNNER_TEMP/supersonic-target:/workspace-target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace-target \
            backpackapp/build:v0.30.1 \
            bash .superpowers/sdd/briefs/bar-c-build-sbf-only.sh
      - name: Assert deploy artifact
        run: |
          test -f "$RUNNER_TEMP/supersonic-target/deploy/supersonic_tx.so"
          ls -la "$RUNNER_TEMP/supersonic-target/deploy/supersonic_tx.so"
